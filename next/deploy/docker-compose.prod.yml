# Pull-only runtime for the Studioarman Next.js image.
# Built in GitHub Actions; this host must not build it.
# Project name is passed as `docker compose -p studioarman-web`.
services:
  web:
    image: ghcr.io/er-ebrahimi/erfan-web:${STUDIOARMAN_IMAGE_TAG}
    platform: linux/amd64
    container_name: studioarman-web-blog
    ports:
      - '3001:4000'
    restart: unless-stopped
    mem_limit: 384m
    # Host DNS has failed to resolve studioarman.site (EAI_AGAIN). Use public resolvers.
    dns:
      - 178.22.122.100
      - 185.51.200.2
      - 185.8.174.140
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
