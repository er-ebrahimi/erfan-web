name: Strapi CI/CD

# Staging Strapi image pipeline.
# Deployment is manual and off by default: the `deploy` job only runs from a
# workflow_dispatch with `deploy` checked. Normal pushes build and publish the image.
# The production Strapi in /root/strapi-docker is never referenced by this workflow.

on:
  push:
    branches:
      - studioarman/v0.0
      - ci/strapi-cicd
    paths:
      - 'strapi/**'
      - '.github/workflows/strapi-cicd.yml'
  pull_request:
    branches:
      - studioarman/v0.0
    paths:
      - 'strapi/**'
      - '.github/workflows/strapi-cicd.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to the staging server (manual; server must be prepared first)'
        type: boolean
        default: false

concurrency:
  group: strapi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/studioarman/v0.0' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/er-ebrahimi/erfan-web
  NODE_VERSION: 22

jobs:
  quality:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: strapi
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: strapi/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn tsc --noEmit
        env:
          APP_KEYS: ci-key-1,ci-key-2,ci-key-3,ci-key-4
          API_TOKEN_SALT: ci-api-token-salt
          ADMIN_JWT_SECRET: ci-admin-jwt-secret
          TRANSFER_TOKEN_SALT: ci-transfer-token-salt
          JWT_SECRET: ci-jwt-secret

      - name: Build Strapi
        run: yarn build
        env:
          APP_KEYS: ci-key-1,ci-key-2,ci-key-3,ci-key-4
          API_TOKEN_SALT: ci-api-token-salt
          ADMIN_JWT_SECRET: ci-admin-jwt-secret
          TRANSFER_TOKEN_SALT: ci-transfer-token-salt
          JWT_SECRET: ci-jwt-secret

      - name: Shell syntax check
        run: sh -n deploy/remote-deploy.sh

  docker:
    name: Build Docker image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/studioarman/v0.0')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./strapi
          file: ./strapi/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/studioarman/v0.0') }}
          provenance: false
          tags: |
            ${{ env.IMAGE_REPO }}:strapi-${{ github.sha }}
            ${{ env.IMAGE_REPO }}:strapi-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to staging (manual)
    needs: docker
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
    environment:
      name: studioarman-strapi
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: strapi-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write runtime env file
        env:
          STRAPI_ENV_LOCAL: ${{ secrets.STRAPI_ENV_LOCAL }}
        run: |
          set -eu
          if [ -z "$STRAPI_ENV_LOCAL" ]; then
            echo "STRAPI_ENV_LOCAL is required" >&2
            exit 1
          fi
          printf '%s\n' "$STRAPI_ENV_LOCAL" | tr -d '\r' > strapi/deploy/.env.runtime
          for key in PUBLIC_URL APP_KEYS API_TOKEN_SALT ADMIN_JWT_SECRET TRANSFER_TOKEN_SALT JWT_SECRET; do
            grep -q "^$key=." strapi/deploy/.env.runtime || {
              echo "Missing $key in STRAPI_ENV_LOCAL" >&2
              exit 1
            }
          done

      - name: Ensure deploy directory
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            mkdir -p /home/deploy/strapi-dev/data/.tmp /home/deploy/strapi-dev/data/public/uploads
            chmod 775 /home/deploy/strapi-dev/data/.tmp /home/deploy/strapi-dev/data/public

      - name: Copy compose file and deploy script
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: strapi/deploy/docker-compose.prod.yml,strapi/deploy/remote-deploy.sh,strapi/deploy/.env.runtime
          target: /home/deploy/strapi-dev/
          strip_components: 2
          overwrite: true

      - name: Pull image and deploy
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          STRAPI_IMAGE_TAG: strapi-${{ github.sha }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 20m
          envs: GHCR_USERNAME,GHCR_PULL_TOKEN,STRAPI_IMAGE_TAG
          script: sh /home/deploy/strapi-dev/remote-deploy.sh
